version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=MOCK
      - STT_PROVIDER=MOCK
      - OCR_PROVIDER=TESSERACT
      - FRONTEND_ORIGINS=http://localhost:3000
      - NIRAMAYA_DATA_FILE=/data/niramaya_store.json
      - NIRAMAYA_UPLOADS=/data/uploads
    volumes:
      # Patient snapshots + uploaded scans survive container restarts.
      - niramaya-data:/data

volumes:
  niramaya-data:
