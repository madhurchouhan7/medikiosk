version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=MOCK
      - STT_PROVIDER=MOCK
      - OCR_PROVIDER=TESSERACT
      - FRONTEND_ORIGINS=http://localhost:3000
      - MEDIKIOSK_DATA_FILE=/data/medikiosk_store.json
      - MEDIKIOSK_UPLOADS=/data/uploads
    volumes:
      # Patient snapshots + uploaded scans survive container restarts.
      - medikiosk-data:/data

volumes:
  medikiosk-data:
