# Render blueprint for the Niramaya FastAPI backend.
# Apply via the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: niramaya-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: MOCK
      - key: STT_PROVIDER
        value: MOCK
      - key: OCR_PROVIDER
        value: TESSERACT
      # Set to your Vercel URL(s) after the frontend is deployed, e.g.
      # https://medikiosk-chi-one.vercel.app,https://medikiosk.vercel.app
      # (comma-separated, no trailing slash). Render reads this at boot:
      # changing it requires a redeploy. Check the [CORS] line in Logs
      # to confirm what the running process loaded.
      - key: FRONTEND_ORIGINS
        sync: false
